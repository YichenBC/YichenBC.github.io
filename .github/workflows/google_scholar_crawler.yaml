name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out crawler
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install and verify dependencies
        run: |
          python -m pip install -r google_scholar_crawler/requirements.txt
          python -m pip check
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"

      - name: Fetch Google Scholar citations
        working-directory: google_scholar_crawler
        timeout-minutes: 5
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          test -n "$GOOGLE_SCHOLAR_ID" || { echo '::error::GOOGLE_SCHOLAR_ID is not configured'; exit 1; }
          status=$(curl --silent --show-error --max-time 30 --get \
            --data-urlencode "user=$GOOGLE_SCHOLAR_ID" \
            --data-urlencode 'hl=en' \
            --output /tmp/scholar-profile.html --write-out '%{http_code}' \
            'https://scholar.google.com/citations')
          echo "Google Scholar HTTP status: $status"
          if [ "$status" != 200 ]; then
            echo "::error::Google Scholar returned HTTP $status to the GitHub runner. Existing citation data is unchanged."
            exit 1
          fi
          timeout 120s python -u -c "import runpy; from scholarly import scholarly; scholarly.set_timeout(20); scholarly.set_retries(2); scholarly.set_logger(True); runpy.run_path('main.py', run_name='__main__')"
          python -m json.tool results/gs_data.json > /dev/null
          python -m json.tool results/gs_data_shieldsio.json > /dev/null

      - name: Check out existing citation history
        uses: actions/checkout@v6
        with:
          ref: google-scholar-stats
          path: citation-data

      - name: Publish citation data
        working-directory: citation-data
        run: |
          cp ../google_scholar_crawler/results/gs_data.json .
          cp ../google_scholar_crawler/results/gs_data_shieldsio.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Update Google Scholar citation data'
          git push origin HEAD:google-scholar-stats
          echo 'Google Scholar citation data refreshed successfully.' >> "$GITHUB_STEP_SUMMARY"
